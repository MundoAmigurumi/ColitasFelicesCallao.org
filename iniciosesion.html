<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Colitas Felices Callao</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
    <link href="css/estructura.css" rel="stylesheet">
    <link href="css/formularios.css" rel="stylesheet">
    <link href="css/iniciosesion.css" rel="stylesheet">
    <link href="css/adaptable.css" rel="stylesheet">
</head>
<body>
<div class="cabecera">
    <div id="menu"></div>
    <div class="portada portada-chica portada-sesion">
        <h1>Iniciar sesión</h1>
        <p>Entra y comparte la historia de tu mascota</p>
    </div>
</div>

<section class="seccion fondo-celeste">
    <form class="formulario" action="colitasFelices.html" method="get">
        <img src="imagenes/usuario.png" class="foto-usuario" alt="Usuario">
        <h2>Bienvenido de vuelta</h2>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>

        <label for="clave">Contraseña</label>
        <div class="campo-clave">
            <input type="password" id="clave" name="contrasena" minlength="6" placeholder="Ingresa tu contraseña" required>
            <button type="button" onclick="verClave('clave','iconoClave')"><img src="imagenes/ojo-cerrado.png" id="iconoClave" alt="Ver contraseña"></button>
        </div>

        <button type="submit" class="boton">Iniciar sesión</button>
        <p class="enlace">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </form>
</section>

<div class="pie" id="pie">
    <p><strong>Una mascota no es solo compañía, es parte de la familia.</strong>
    Cuidemos, valoremos y protejamos a quienes siempre están a nuestro lado. 🐾❤️</p>
</div>
<script src="js/menu.js"></script>
</body>
</html>
